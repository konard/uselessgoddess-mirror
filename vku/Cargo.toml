[package]
name = "vku"
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
description = "Minimal headless Vulkan offscreen-rendering harness for the mirror layer's tests and example"
license = "MIT"
publish = false

[dependencies]
# `loaded` pulls in libloading so the loader is found at runtime — there is no
# build-time link against the Vulkan loader.
ash = { version = "0.38", default-features = false, features = ["loaded", "debug"] }
png = "0.17"
