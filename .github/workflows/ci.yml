name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Render headlessly through Mesa's lavapipe CPU driver.
  VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
  XDG_RUNTIME_DIR: /tmp

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install glslang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Vulkan stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            glslang-tools mesa-vulkan-drivers vulkan-tools \
            vulkan-validationlayers libvulkan1
      - name: Build
        run: cargo build --workspace --profile ${{ matrix.profile }}
      - name: Test
        run: cargo test --workspace --profile ${{ matrix.profile }} -- --nocapture
      - name: Render screenshots
        if: matrix.profile == 'release'
        run: cargo run --release --example scene -- docs/screenshots
      - name: Upload screenshots
        if: matrix.profile == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
