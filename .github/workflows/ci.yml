name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check clang-format
        run: |
          clang-format-18 --dry-run --Werror \
            src/*.c src/*.h tests/*.c tests/*.h examples/*.c examples/*.h

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    runs-on: ubuntu-24.04
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libvulkan-dev vulkan-tools glslang-tools \
            mesa-vulkan-drivers vulkan-validationlayers zlib1g-dev
      - name: Configure
        run: cmake --preset ci -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci
      - name: Upload screenshots
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/ci/screenshots/*.png
          if-no-files-found: error

  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libvulkan-dev vulkan-tools glslang-tools \
            mesa-vulkan-drivers vulkan-validationlayers zlib1g-dev
      - name: Configure
        run: cmake --preset sanitize
      - name: Build
        run: cmake --build --preset sanitize
      - name: Test
        # The Vulkan loader and the mesa driver leak a few allocations by
        # design (dlopen'd modules); leak checking would only report those.
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --preset sanitize
